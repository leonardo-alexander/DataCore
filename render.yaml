databases:
  - name: datacore-db
    databaseName: datacore
    user: datacore
    plan: free
    region: singapore

services:
  - type: web
    name: datacore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: DataCore
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: datacore-db
          property: connectionString

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      - key: RUN_SEEDERS
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@datacore.test
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_PASSWORD
        sync: false

      - key: CLEANING_API_URL
        value: https://leonardo-alexander-data-cleaning.hf.space/process

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
